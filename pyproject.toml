
[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded_qa"
version = "1.0.0"
description = "A modular RAG pipeline using Groq, FastEmbed, and Qdrant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.30,<2.0",
    "fastembed>=0.7,<1.0",
    "qdrant-client==1.20.0",
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
