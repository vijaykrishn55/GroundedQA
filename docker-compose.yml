services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: basic-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basic-rag-app
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

volumes:
  qdrant_data:
